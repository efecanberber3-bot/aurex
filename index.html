<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0e10" />
    <meta name="description" content="AUREX — Personal Training Management" />
    <title>AUREX | Personal Training</title>
  </head>
  <body>
    <div id="app">
      <div class="boot-screen"><img src="/aurex/aurex-logo.svg" alt="AUREX" style="width:190px;height:auto;margin-bottom:18px"><p>AUREX yükleniyor...</p></div>
    </div>
    <script>
      // If the app bundle fails to load, show a useful message instead of an endless spinner.
      window.setTimeout(() => {
        const app = document.querySelector('#app');
        if (app && app.querySelector('.boot-screen')) {
          app.innerHTML = `
            <main style="min-height:100vh;display:grid;place-items:center;padding:32px;background:#11110f;color:#f4f0e8;font-family:Inter,Arial,sans-serif;text-align:center">
              <section style="max-width:560px">
                <div style="font-size:42px;font-weight:800;color:#d6b36a">A</div>
                <h1 style="font-size:24px">AUREX başlatılamadı</h1>
                <p style="color:#b8b2a6;line-height:1.7">Uygulama dosyaları yüklenemedi. GitHub Actions yayınlama işlemini ve GitHub Pages kaynağının <b>GitHub Actions</b> olduğunu kontrol edin.</p>
                <button onclick="location.reload()" style="padding:12px 20px;border:0;border-radius:8px;background:#d6b36a;color:#171511;font-weight:700;cursor:pointer">Yeniden dene</button>
              </section>
            </main>`;
        }
      }, 10000);
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
